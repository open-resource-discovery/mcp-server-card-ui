name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

jobs:
  pr-preview:
    permissions:
      contents: read
      actions: write
      pull-requests: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.1"

      - name: Build preview
        if: github.event.action != 'closed'
        env:
          PR_PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          BASE_URL: /pr-preview/mcp-server-card-ui/pr-${{ github.event.pull_request.number }}/
          VITE_PLAYGROUND_CONFIG: ${{ vars.VITE_PLAYGROUND_CONFIG }}
        run: |
          set -euo pipefail
          npm ci
          npm run build:standalone
          npm run copy:website-standalone
          cd website
          npm ci
          npm run build

      - name: PR preview
        uses: open-resource-discovery/pr-preview-action@main
        with:
          fork: true
          target-repo: open-resource-discovery/pr-preview
          pages-base-url: https://open-resource-discovery.github.io/pr-preview
          umbrella-dir: mcp-server-card-ui
          token: ${{ secrets.PR_PREVIEW_TOKEN }}
          build-dir: website/build
